version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: standard
  enable:
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nolintlint
    - revive
    - unconvert
    - unparam
  settings:
    misspell:
      locale: UK
    gosec:
      excludes:
        - G204 # subprocess with variable: ktags runs ansible/ssh by design; reviewed per call site
  exclusions:
    generated: lax
    paths:
      - spikes
    rules:
      - path: _test\.go
        linters: [gosec, unparam]

formatters:
  enable:
    - gofmt
  exclusions:
    paths:
      - spikes
