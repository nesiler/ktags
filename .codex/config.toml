# Codex CLI project defaults for ktags. Loaded only after the folder is trusted.
# Provider, auth, notification and profile keys cannot be set here by design; those live in
# ~/.codex/config.toml. Instructions come from AGENTS.md, skills from .agents/skills/.

approval_policy = "on-request"
sandbox_mode = "workspace-write"
model = "gpt-6-astra"

[agents]
enabled = true
max_concurrent_threads_per_session = 3
default_subagent_model = "gpt-5.6-sol"
default_subagent_reasoning_effort = "high"
